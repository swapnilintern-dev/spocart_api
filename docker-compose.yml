# VPS deployment: API + Caddy (automatic HTTPS). Database lives on Neon.
services:
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "3000"
    volumes:
      - uploads:/app/uploads/designs      # buyer artwork survives redeploys
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:-api.spocart.info}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  uploads:
  caddy_data:
  caddy_config:
